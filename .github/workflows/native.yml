name: Native builds
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle :android-controller:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MultiControl-Android-debug
          path: android-controller/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r windows-receiver/requirements.txt
      - run: python -m PyInstaller --onefile --windowed --name MultiControlReceiver windows-receiver/receiver.py
      - uses: actions/upload-artifact@v4
        with:
          name: MultiControl-Windows-receiver
          path: dist/MultiControlReceiver.exe
          if-no-files-found: error

  preview-release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MultiControl-Android-debug
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: MultiControl-Windows-receiver
          path: release
      - name: Publish clearly labeled technical preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0-alpha >/dev/null 2>&1; then
            gh release upload v0.1.0-alpha release/*.apk release/*.exe --clobber
          else
            gh release create v0.1.0-alpha release/*.apk release/*.exe --target "$GITHUB_SHA" --prerelease --title "0.1.0 alpha · essai Android → Windows" --notes "Essai technique Android vers Windows ou Android avec Receiver expérimental. Ce n'est pas la V1 multi-appareils ni FOLLOW matériel. Voir docs/INSTALLATION.md et docs/VALIDATION.md avant installation."
          fi
