name: Native builds
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle :android-controller:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MultiControl-Android-debug
          path: android-controller/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r windows-receiver/requirements.txt
      - run: python -m PyInstaller --onefile --windowed --name MultiControlReceiver windows-receiver/receiver.py
      - uses: actions/upload-artifact@v4
        with:
          name: MultiControl-Windows-receiver
          path: dist/MultiControlReceiver.exe
          if-no-files-found: error
